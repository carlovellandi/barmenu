name: Update board data

on:
  schedule:
    - cron: "*/6 * * * *"   # every 6 minutes (GitHub may delay this by a few minutes)
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: update-board
  cancel-in-progress: true   # a new run replaces a stale one instead of queueing behind it

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4       # never let a hung fetch block the schedule
    steps:
      - uses: actions/checkout@v4

      - name: Fetch scores and drink list
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          BOARD_TZ: America/New_York
        run: python3 scripts/update_data.py

      - name: Commit if anything changed
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update board data"
            git push
          fi
