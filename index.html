<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Beren's Nine</title>
<style>
  /* Built for a 2014-era TV WebKit: tables/floats, no flexbox, ES5 only. */
  @font-face { font-family: "Board"; src: url("condensed-bold.ttf") format("truetype"), url("fonts/condensed-bold.ttf") format("truetype"); font-weight: bold; }

  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
               background: #17120F; color: #F1E6C8;
               font-family: "Board", Impact, "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-weight: bold; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px;
           -webkit-transform-origin: 0 0; transform-origin: 0 0; }

  /* laminated-sheet frame */
  #frame { position: absolute; left: 0; top: 0; width: 1272px; height: 712px;
           border: 4px double #6B5A48; }
  .corner { position: absolute; width: 18px; height: 18px; border: 3px solid #E0B33B; }
  .c1 { left: 10px; top: 10px; border-right: 0; border-bottom: 0; }
  .c2 { right: 10px; top: 10px; border-left: 0; border-bottom: 0; }
  .c3 { left: 10px; bottom: 10px; border-right: 0; border-top: 0; }
  .c4 { right: 10px; bottom: 10px; border-left: 0; border-top: 0; }

  /* header: beer-sign marquee */
  #top { position: absolute; left: 34px; top: 30px; width: 1212px; height: 108px;
         border-bottom: 4px solid #B8372E; }
  #top .rule2 { position: absolute; left: 0; right: 0; bottom: -10px; height: 0; border-bottom: 2px solid #2F6B3F; }
  #barname { position: absolute; left: 6px; top: 2px; font-size: 76px; line-height: 84px; letter-spacing: 3px;
             text-transform: uppercase; color: #F1E6C8;
             text-shadow: 3px 3px 0 #B8372E, -2px -2px 0 #2F6B3F; }
  #tag { position: absolute; left: 10px; top: 84px; font-size: 15px; letter-spacing: 4px; color: #E0B33B; text-transform: uppercase; }
  #clockbox { position: absolute; right: 0; top: 8px; width: 250px; height: 82px; background: #0B0907; border: 3px solid #4A3E33; }
  #clock { position: absolute; left: 0; right: 0; top: 4px; text-align: center; font-family: "Courier New", Courier, monospace;
           font-size: 50px; line-height: 54px; color: #E0B33B; letter-spacing: 2px; }
  #date { position: absolute; left: 0; right: 0; top: 56px; text-align: center; font-size: 14px; letter-spacing: 3px; color: #8C7B66; text-transform: uppercase; }

  /* slide */
  .slide { position: absolute; left: 34px; top: 156px; width: 1212px; height: 486px; opacity: 0;
           -webkit-transition: opacity .35s; transition: opacity .35s; }
  .slide.show { opacity: 1; }
  .hdr { position: relative; height: 54px; }
  .hdr .t { position: absolute; left: 0; top: 0; width: 980px; white-space: nowrap; overflow: hidden; font-size: 42px; line-height: 50px; letter-spacing: 2px; text-transform: uppercase; color: #F1E6C8; }
  .hdr .t .lg { color: #E0B33B; }
  .hdr .stamp { position: absolute; right: 8px; top: 8px; }
  .body { position: absolute; left: 0; top: 66px; width: 1212px; height: 420px; overflow: hidden; }

  /* stamps & tags */
  .stamp { display: inline-block; padding: 3px 12px 2px; border: 3px solid #B8372E; color: #B8372E; font-size: 18px;
           letter-spacing: 3px; text-transform: uppercase; line-height: 22px;
           -webkit-transform: rotate(-2deg); transform: rotate(-2deg); }
  .stamp.y { border-color: #E0B33B; color: #E0B33B; -webkit-transform: rotate(1.5deg); transform: rotate(1.5deg); }
  .stamp.g { border-color: #2F6B3F; color: #5E9C6C; -webkit-transform: rotate(-1deg); transform: rotate(-1deg); }
  .stamp.sm { font-size: 13px; padding: 1px 8px 0; border-width: 2px; letter-spacing: 2px; line-height: 17px; }

  /* scoreboard rows: scorebug strips */
  table.sb { width: 1212px; border-collapse: separate; border-spacing: 0 6px; }
  table.sb td { height: 50px; vertical-align: middle; background: #221B16; border-top: 1px solid #3A3028; border-bottom: 1px solid #0B0907; }
  td.team { width: 360px; padding: 0 14px; font-size: 30px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; overflow: hidden; }
  td.team .rk { color: #E0B33B; font-size: 18px; margin-right: 6px; }
  td.team .rc { color: #8C7B66; font-size: 14px; margin-left: 8px; letter-spacing: 0; }
  td.num { width: 92px; text-align: center; font-size: 44px; color: #F1E6C8; background: #0B0907; border: 1px solid #3A3028; }
  td.num.win { color: #E0B33B; }
  td.pre td.num, tr.pre td.num { color: #4A3E33; }
  td.mid { width: 40px; text-align: center; color: #8C7B66; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; }
  td.stat { width: 230px; padding: 0 14px; text-align: right; font-size: 22px; letter-spacing: 1px; text-transform: uppercase; color: #C9B994; white-space: nowrap; }
  td.stat .live { display: inline-block; background: #B8372E; color: #F1E6C8; padding: 2px 10px 1px; }
  td.stat .tv { display: block; font-size: 13px; color: #8C7B66; letter-spacing: 2px; }
  tr.done td.team { color: #B7A88C; }
  tr.done td.team.win { color: #F1E6C8; }

  /* menu: laminated sheet */
  .menucol { float: left; width: 574px; margin-right: 64px; }
  .menucol.last { margin-right: 0; }
  table.menu { width: 574px; border-collapse: collapse; }
  tr.cat td { padding: 12px 0 4px; }
  tr.cat.first td { padding-top: 0; }
  .band { display: inline-block; background: #B8372E; color: #F1E6C8; font-size: 20px; letter-spacing: 4px; text-transform: uppercase;
          padding: 3px 14px 2px 12px; line-height: 24px; }
  .band.g { background: #2F6B3F; } .band.y { background: #E0B33B; color: #17120F; } .band.n { background: #4A3E33; }
  .cap { display: inline-block; width: 14px; height: 14px; border: 3px dotted #E0B33B; border-radius: 12px; margin-right: 8px; vertical-align: -2px; background: #B8372E; }
  tr.item td { padding: 5px 0 2px; vertical-align: baseline; font-size: 26px; line-height: 30px; letter-spacing: 1px; }
  tr.item td.nm { white-space: nowrap; }
  tr.item td.dots { width: 100%; padding: 0 6px; }
  tr.item td.dots span { display: block; height: 14px; border-bottom: 3px dotted #4A3E33; }
  tr.item td.pr { text-align: right; color: #E0B33B; font-size: 28px; padding-left: 8px; white-space: nowrap; }
  tr.item .nt { display: block; font-size: 14px; line-height: 16px; color: #8C7B66; letter-spacing: 1px; font-family: "Courier New", Courier, monospace; font-weight: normal; }

  /* up next */
  table.up { width: 1212px; border-collapse: collapse; table-layout: fixed; }
  table.up td { height: 46px; vertical-align: middle; border-bottom: 2px dotted #3A3028; font-size: 26px;
                text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; overflow: hidden; }
  td.tm { width: 150px; color: #E0B33B; font-family: "Courier New", Courier, monospace; font-size: 26px; }
  td.lg { width: 190px; }
  td.lg span { display: inline-block; background: #2F6B3F; color: #F1E6C8; font-size: 15px; letter-spacing: 3px; padding: 2px 8px 1px; }
  td.mu { width: 722px; }
  td.mu .v { color: #8C7B66; font-size: 16px; margin: 0 8px; }
  td.ch { width: 150px; text-align: right; color: #8C7B66; font-size: 15px; letter-spacing: 2px; }

  /* harvard */
  table.hv { width: 1212px; border-collapse: collapse; table-layout: fixed; }
  table.hv td { height: 52px; vertical-align: middle; border-bottom: 2px dotted #3A3028; font-size: 26px; text-transform: uppercase; letter-spacing: 1px;
                white-space: nowrap; overflow: hidden; }
  td.hsp { width: 300px; color: #F1E6C8; font-size: 26px; letter-spacing: 1px; }
  td.hwl { width: 60px; }
  td.hwl span { display: inline-block; width: 30px; text-align: center; font-size: 20px; padding: 2px 0 1px; border: 3px solid #2F6B3F; color: #5E9C6C; }
  td.hwl span.l { border-color: #B8372E; color: #B8372E; }
  td.hop { width: 420px; color: #C9B994; font-size: 24px; }
  td.hop .v { color: #8C7B66; font-size: 16px; margin-right: 8px; }
  td.hsc { width: 150px; text-align: right; font-size: 32px; white-space: nowrap; font-family: "Courier New", Courier, monospace; }
  td.hsc .w { color: #E0B33B; }
  td.hst { width: 232px; text-align: right; color: #C9B994; font-size: 20px; letter-spacing: 1px; white-space: nowrap; padding-right: 4px; }
  td.hst .live { display: inline-block; background: #B8372E; color: #F1E6C8; padding: 2px 10px 1px; }

  /* headlines: newspaper briefs */
  .story { position: relative; height: 130px; overflow: hidden; border-bottom: 2px dotted #3A3028; padding-top: 8px; }
  .story.last { border-bottom: 0; }
  .story .lg { position: absolute; left: 0; top: 12px; width: 90px; }
  .story .lg span { display: inline-block; background: #B8372E; color: #F1E6C8; font-size: 14px; letter-spacing: 3px; padding: 3px 8px 2px; }
  .story .lg span.rc { background: #2F6B3F; }
  .story .hl { margin-left: 100px; font-size: 29px; line-height: 33px; text-transform: uppercase; letter-spacing: 1px; max-height: 66px; overflow: hidden; }
  .story .ds { margin-left: 100px; margin-top: 3px; font-family: "Courier New", Courier, monospace; font-weight: normal;
               font-size: 17px; line-height: 21px; color: #C9B994; max-height: 42px; overflow: hidden; }
  .story .by { margin-left: 100px; font-family: "Courier New", Courier, monospace; font-weight: normal;
               font-size: 12px; letter-spacing: 2px; color: #6B5A48; text-transform: uppercase; }

  /* the feature: one story, set in two columns and meant to be read */
  .feat { position: relative; height: 420px; }
  .feat .kick { height: 18px; font-size: 15px; line-height: 18px; letter-spacing: 5px; color: #E0B33B; text-transform: uppercase; }
  .feat .fhl { margin-top: 8px; font-size: 40px; line-height: 44px; text-transform: uppercase; letter-spacing: 1px;
               height: 88px; overflow: hidden; }
  .feat .rule { margin: 10px 0 0; width: 240px; border-bottom: 3px solid #B8372E; }
  .feat .fby { height: 16px; margin: 6px 0 10px; font-family: "Courier New", Courier, monospace; font-weight: normal;
               font-size: 13px; line-height: 16px; letter-spacing: 3px; color: #8C7B66; text-transform: uppercase; }
  .feat .fbody { height: 256px; overflow: hidden; }
  .feat .fbody.full { height: 350px; }
  .feat .fcol { float: left; width: 578px; margin-right: 56px; }
  .feat .fcol.last { margin-right: 0; }
  .feat .fcol p { font-family: Georgia, "Times New Roman", serif; font-weight: normal; font-size: 20px;
                  line-height: 27px; color: #D9CBA8; margin: 0 0 12px; }
  .feat .fcol p.last { margin-bottom: 0; }
  .feat .more { position: absolute; right: 0; bottom: 0; font-family: "Courier New", Courier, monospace;
                font-weight: normal; font-size: 13px; letter-spacing: 3px; color: #6B5A48; text-transform: uppercase; }

  /* polls: AP top 25 in two columns */
  .pollcol { float: left; width: 586px; margin-right: 40px; }
  .pollcol.last { margin-right: 0; }
  table.poll { width: 586px; border-collapse: collapse; table-layout: fixed; }
  table.poll td { height: 30px; line-height: 30px; padding: 0; vertical-align: middle; font-size: 24px;
                  letter-spacing: 1px; text-transform: uppercase;
                  white-space: nowrap; overflow: hidden; border-bottom: 1px dotted #2A231D; }
  table.poll td.pn { width: 54px; text-align: right; padding-right: 16px; color: #E0B33B; font-family: "Courier New", Courier, monospace; }
  td.pt { }
  table.poll td.pr2 { width: 94px; text-align: right; color: #8C7B66; font-size: 17px; font-family: "Courier New", Courier, monospace; }
  table.poll td.pm { width: 60px; text-align: right; font-size: 15px; font-family: "Courier New", Courier, monospace; color: #6B5A48; }
  table.poll td.pm .up { color: #5E9C6C; } td.pm .dn { color: #B8372E; }

  /* standings blocks */
  .stblk { float: left; width: 578px; height: 182px; margin: 0 56px 16px 0; }
  .stblk.r { margin-right: 0; }
  .stblk .sh { font-size: 19px; letter-spacing: 4px; text-transform: uppercase; color: #F1E6C8;
               border-bottom: 3px solid #2F6B3F; padding-bottom: 4px; margin-bottom: 4px; }
  table.st { width: 578px; border-collapse: collapse; table-layout: fixed; }
  table.st td { height: 28px; line-height: 28px; padding: 0; vertical-align: middle; font-size: 21px;
                letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  table.st td.sn { width: 40px; padding-right: 10px; color: #6B5A48; font-size: 16px; font-family: "Courier New", Courier, monospace; }
  table.st td.sr { width: 118px; text-align: right; color: #E0B33B; font-family: "Courier New", Courier, monospace; font-size: 21px; }
  table.st td.sx { width: 86px; text-align: right; color: #8C7B66; font-size: 15px; font-family: "Courier New", Courier, monospace; }

  /* favorite team marker */
  td.team .fav { color: #E0B33B; margin-right: 6px; }

  /* ===== THE GAME: special edition =====================================
     Everything below only applies while <body> carries class "game", which the
     script adds inside the dated window and removes when it closes. */
  body.game { background: #1A0A0D; }
  body.game #frame { border-color: #7A1626; }
  body.game .corner { border-color: #F1E6C8; }
  body.game #top { border-bottom-color: #A51C30; }
  body.game #top .rule2 { border-bottom-color: #F1E6C8; }
  body.game #barname { text-shadow: 3px 3px 0 #A51C30, -2px -2px 0 #000; }
  body.game #tag { color: #F1E6C8; }
  body.game #clockbox { border-color: #A51C30; }
  body.game #date { color: #E0B33B; letter-spacing: 2px; }
  body.game #tally span.on { background: #F1E6C8; }
  body.game.won #frame { border-color: #E0B33B; }
  body.game.won .corner { border-color: #A51C30; }
  .stamp.b { border-color: #3D6CB0; color: #7FA6DE; -webkit-transform: rotate(1.5deg); transform: rotate(1.5deg); }

  /* title card */
  .gt { height: 420px; text-align: center; overflow: hidden; }
  .gt .k { height: 28px; line-height: 28px; font-size: 21px; letter-spacing: 10px; color: #E0B33B; text-transform: uppercase; }
  .gt .big { height: 150px; line-height: 150px; font-size: 146px; letter-spacing: 10px; color: #F1E6C8; text-transform: uppercase;
             text-shadow: 6px 6px 0 #A51C30; }
  table.gm { width: 1080px; margin: 12px auto 0; border-collapse: collapse; table-layout: fixed; }
  table.gm td { height: 92px; vertical-align: middle; text-align: center; white-space: nowrap; overflow: hidden; }
  td.gm-h, td.gm-y { width: 470px; font-size: 50px; line-height: 54px; letter-spacing: 3px; text-transform: uppercase; color: #F1E6C8; }
  td.gm-h { background: #A51C30; } td.gm-y { background: #0F3D7A; }
  td.gm-h .r, td.gm-y .r { display: block; font-family: "Courier New", Courier, monospace; font-weight: normal;
                           font-size: 17px; line-height: 20px; letter-spacing: 3px; color: #F1E6C8; }
  td.gm-v { font-size: 22px; letter-spacing: 4px; color: #8C7B66; text-transform: uppercase; }
  .gt .w { height: 30px; line-height: 30px; margin-top: 16px; font-size: 20px; letter-spacing: 4px; color: #F1E6C8; text-transform: uppercase; }
  .gt .w2 { height: 26px; line-height: 26px; margin-top: 6px; font-size: 16px; letter-spacing: 4px; color: #8C7B66; text-transform: uppercase; }

  /* tale of the tape */
  table.tp { width: 1212px; border-collapse: collapse; table-layout: fixed; }
  table.tp td { height: 42px; padding: 0; vertical-align: middle; font-size: 25px; letter-spacing: 1px; text-transform: uppercase;
                white-space: nowrap; overflow: hidden; border-bottom: 1px solid #3A1A20; }
  table.tp tr.hd td { height: 50px; font-size: 31px; letter-spacing: 4px; color: #F1E6C8; border-bottom: 0; }
  table.tp td.tp-h { width: 440px; text-align: right; padding-right: 26px; color: #C9B994; }
  table.tp td.tp-l { width: 280px; text-align: center; font-family: "Courier New", Courier, monospace; font-weight: normal;
                     font-size: 14px; letter-spacing: 3px; color: #8C7B66; }
  table.tp td.tp-y { text-align: left; padding-left: 26px; color: #C9B994; }
  table.tp td.win { color: #E0B33B; }
  table.tp tr.hd td.tp-h { background: #A51C30; color: #F1E6C8; }
  table.tp tr.hd td.tp-y { background: #0F3D7A; color: #F1E6C8; }

  /* impact players / know the enemy */
  table.ip { width: 1212px; border-collapse: separate; border-spacing: 0 6px; table-layout: fixed; }
  table.ip td { height: 56px; padding: 0; vertical-align: middle; background: #26141A; white-space: nowrap; overflow: hidden;
                font-size: 28px; letter-spacing: 1px; text-transform: uppercase; }
  table.ip td.ip-n { width: 84px; text-align: center; font-size: 38px; background: #A51C30; color: #F1E6C8; }
  table.ip.yl td.ip-n { background: #0F3D7A; }
  table.ip td.ip-nm { width: 372px; padding-left: 16px; }
  table.ip td.ip-c { width: 214px; font-family: "Courier New", Courier, monospace; font-weight: normal; font-size: 14px;
                     letter-spacing: 3px; color: #8C7B66; }
  table.ip td.ip-s { text-align: right; padding-right: 14px; font-size: 22px; color: #E0B33B; }
  table.ip tr.house td { background: #3B1820; }
  table.ip tr.house td.ip-n { background: #E0B33B; color: #1A0A0D; }
  table.ip tr.house td.ip-c { color: #E0B33B; }
  .ip-note { height: 34px; line-height: 34px; margin-top: 8px; font-size: 19px; letter-spacing: 3px; color: #C9B994;
             text-transform: uppercase; white-space: nowrap; overflow: hidden; }

  /* stakes / history: keyed rows */
  table.sk { width: 1212px; border-collapse: collapse; table-layout: fixed; }
  table.sk td { height: 78px; padding: 0; vertical-align: middle; border-bottom: 2px dotted #3A1A20; overflow: hidden; }
  table.sk tr.last td { border-bottom: 0; }
  table.sk td.sk-k { width: 232px; font-size: 22px; letter-spacing: 4px; color: #E0B33B; text-transform: uppercase; white-space: nowrap; }
  table.sk td.sk-k.yr { font-family: "Courier New", Courier, monospace; font-size: 40px; letter-spacing: 2px; }
  table.sk td.sk-t { font-size: 27px; line-height: 32px; letter-spacing: 1px; text-transform: uppercase; }

  /* notes on Yale */
  table.rs { width: 1212px; border-collapse: collapse; table-layout: fixed; }
  table.rs td { height: 96px; padding: 0; vertical-align: middle; border-bottom: 2px dotted #3A1A20; overflow: hidden; }
  table.rs tr.last td { border-bottom: 0; }
  table.rs td.rs-n { width: 88px; font-family: "Courier New", Courier, monospace; font-size: 52px; color: #A51C30; }
  table.rs td.rs-t { font-size: 30px; line-height: 36px; letter-spacing: 1px; text-transform: uppercase; }

  /* live + final scoreboard */
  table.lv { width: 1212px; border-collapse: separate; border-spacing: 0 8px; table-layout: fixed; }
  table.lv td { height: 100px; padding: 0; vertical-align: middle; background: #26141A; white-space: nowrap; overflow: hidden; }
  table.lv td.lv-t { padding-left: 22px; font-size: 66px; letter-spacing: 3px; text-transform: uppercase; }
  table.lv tr.hv td.lv-t { border-left: 16px solid #A51C30; color: #F1E6C8; }
  table.lv tr.yl td.lv-t { border-left: 16px solid #0F3D7A; color: #B7A88C; }
  table.lv td.lv-q { width: 58px; text-align: center; font-family: "Courier New", Courier, monospace; font-size: 26px; color: #C9B994; }
  table.lv td.lv-s { width: 190px; text-align: center; font-size: 92px; background: #0B0907; color: #B7A88C; }
  table.lv td.lv-s.lead { color: #E0B33B; }
  .lv-st { height: 40px; line-height: 40px; font-size: 23px; letter-spacing: 4px; color: #E0B33B; text-transform: uppercase;
           white-space: nowrap; overflow: hidden; }
  .lv-st .live { display: inline-block; background: #B8372E; color: #F1E6C8; padding: 0 12px; margin-right: 12px; }
  .lv-ln { height: 34px; line-height: 34px; font-size: 20px; letter-spacing: 2px; color: #C9B994; text-transform: uppercase;
           white-space: nowrap; overflow: hidden; }
  .lv-ln b { color: #E0B33B; font-weight: bold; }
  .lv-stamps { height: 56px; padding-top: 10px; }
  .lv-stamps .stamp { margin-right: 18px; font-size: 20px; }

  /* scoring summary */
  table.sp { width: 1212px; border-collapse: collapse; table-layout: fixed; }
  table.sp td { height: 46px; padding: 0; vertical-align: middle; border-bottom: 2px dotted #3A1A20; white-space: nowrap; overflow: hidden;
                font-size: 22px; letter-spacing: 1px; text-transform: uppercase; }
  table.sp td.sp-q { width: 150px; font-family: "Courier New", Courier, monospace; color: #E0B33B; }
  table.sp td.sp-m { width: 110px; }
  table.sp td.sp-m span { display: inline-block; padding: 2px 8px 1px; font-size: 14px; letter-spacing: 3px; color: #F1E6C8; background: #A51C30; }
  table.sp td.sp-m span.y { background: #0F3D7A; }
  table.sp td.sp-x { width: 120px; text-align: right; font-family: "Courier New", Courier, monospace; font-size: 24px; color: #F1E6C8; }

  /* idle */
  .idle { position: absolute; left: 0; top: 130px; width: 1212px; text-align: center; }
  .idle .big { font-size: 60px; letter-spacing: 6px; text-transform: uppercase; color: #E0B33B; }
  .idle .small { font-size: 20px; letter-spacing: 3px; color: #8C7B66; margin-top: 18px; text-transform: uppercase; }

  /* click zones (invisible) + paused stamp */
  .zone { position: absolute; top: 150px; height: 500px; cursor: pointer; background: transparent; }
  #zprev { left: 0; width: 400px; } #zpause { left: 400px; width: 480px; } #znext { left: 880px; width: 400px; }
  #paused { position: absolute; left: 0; right: 0; top: 330px; text-align: center; display: none; }
  #paused .stamp { font-size: 30px; padding: 6px 22px 4px; background: #17120F; }

  /* footer: notice + sponsor + tally */
  #foot { position: absolute; left: 34px; top: 652px; width: 1212px; height: 40px; }
  #notice { position: absolute; left: 0; top: 4px; }
  #sponsor { position: absolute; right: 0; top: 0; text-align: right; font-size: 12px; letter-spacing: 2px; color: #6B5A48; text-transform: uppercase; }
  #sponsor .u { color: #8C7B66; display: block; margin-top: 3px; }
  #tally { position: absolute; left: 0; right: 0; bottom: -4px; text-align: center; }
  #tally span { display: inline-block; width: 3px; height: 12px; background: #4A3E33; margin: 0 3px;
                -webkit-transform: rotate(8deg); transform: rotate(8deg); }
  #tally span.on { background: #E0B33B; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame"><div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div></div>
  <div id="top">
    <div id="barname">Beren's Nine</div>
    <div id="tag">Cold beer &middot; live sports &middot; no refunds on bad calls</div>
    <div id="clockbox"><div id="clock">--:--</div><div id="date"></div></div>
    <div class="rule2"></div>
  </div>
  <div id="slideA" class="slide"></div>
  <div id="slideB" class="slide"></div>
  <div id="zprev" class="zone" onclick="boardPrev()"></div>
  <div id="zpause" class="zone" onclick="boardPause()"></div>
  <div id="znext" class="zone" onclick="boardNext()"></div>
  <div id="paused"><span class="stamp">Paused</span></div>
  <div id="err" style="display:none;position:absolute;left:0;top:0;width:1280px;background:#B8372E;color:#fff;font-family:monospace;font-size:16px;line-height:20px;padding:10px;z-index:99"></div>
  <div id="foot">
    <div id="notice"></div>
    <div id="sponsor"></div>
    <div id="tally"></div>
  </div>
</div>

<script>
// Show errors on screen instead of a blank page (old TV browsers give no console).
window.onerror = function (msg, url, line) {
  try {
    var e = document.getElementById("err");
    if (e) { e.style.display = "block"; e.innerHTML += "ERR: " + msg + " (line " + line + ")<br>"; }
  } catch (x) {}
  return true;
};
(function () {
  // ---------- settings ----------
  var BAR_NAME        = "Beren's Nine";
  var SECONDS_PER     = 10;
  var GAMES_PER_PAGE  = 6;      // scoreboard rows per slide (6 x 55 + spacing = 372)
  var UPNEXT_PER_PAGE = 8;      // "up next" rows per slide (8 is what fits)
  var HARVARD_PER_PAGE= 7;
  var MENU_ROWS_PER_COL = 8;
  var POLL_PER_COL    = 13;     // 13 + 12 = a full top 25 on one slide
  var GROUPS_PER_SLIDE= 4;      // divisions/conferences per standings slide
  var STORIES_PER_SLIDE = 3;    // briefs per morning-paper slide
  var FEATURE_SECONDS = 30;     // the feature is meant to be read, so it lingers
  var FEATURE_MAX_PAGES = 2;
  // Feature text is packed by column height, which is what actually overflows.
  // These mirror .feat .fbody / .fbody.full in the stylesheet.
  var FEAT_BODY_P1 = 256;       // px of text column beside the headline
  var FEAT_BODY_P2 = 350;       // px on a continuation page
  var FEAT_LINE = 27;           // line-height of .feat .fcol p
  var FEAT_PARA_GAP = 12;       // its margin-bottom
  var FEAT_CHARS_PER_LINE = 62; // 578px column at 20px Georgia
  var MAX_CYCLE       = 60;     // longest full rotation, in slides
  var REFRESH_MINUTES = 1.5;    // how often the TV re-reads the data files
  var RELOAD_HOUR     = 4;      // daily reload, only after 24h of uptime
  var SAFE_AREA       = 1.0;    // lower (e.g. 0.95) only if the TV clips the frame edges
  var MORNING_START   = 5;      // morning mode (the paper) runs from this hour...
  var MORNING_END     = 12;     // ...until this hour (noon)
  var DEFAULT_NOTICES = [        // used until the sheet has rows with Category = Notice
    "Tip your bartender",
    "No tabs after 1:00 AM",
    "If you take the last one, you're on the fridge run",
    "Please don't argue with the scoreboard",
    "Lost and found is the couch cushions"
  ];
  var SPONSORS = [
    "Scores courtesy of the house",
    "Ice provided by the ice machine",
    "Official beverage: whatever's in the fridge",
    "Referees not affiliated with this establishment"
  ];
  var LEAGUE_TAG = { "NFL": "NFL", "NBA": "NBA", "NHL": "NHL", "MLB": "MLB", "Premier League": "EPL",
                     "College Football": "CFB", "College Basketball": "CBB" };
  // --------------------------------

  var scores = { leagues: [] };
  var drinks = { items: [], notices: [] };
  var screens = [];
  var idx = -1, frontIsA = false, noticeIdx = 0, timer = null, paused = false;
  var ticks = 0;   // seconds this page has been running (immune to clock changes)

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function getJSON(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open("GET", url + "?t=" + new Date().getTime(), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status === 200 || x.status === 0) { try { ok(JSON.parse(x.responseText)); } catch (e) { fail(e); } }
      else fail(x.status);
    };
    try { x.send(null); } catch (e) { fail(e); }
  }
  function refresh() {
    getJSON("data/scores.json", function (d) { scores = d || scores; buildScreens(); }, function () {});
    getJSON("data/drinks.json", function (d) { drinks = d || drinks; buildScreens(); }, function () {});
  }

  // ---------- screens ----------
  function drinkPages() {
    var items = drinks.items || [];
    if (!items.length) return [];
    var cats = [], byCat = {};
    for (var i = 0; i < items.length; i++) {
      var c = items[i].cat || "Drinks";
      if (!byCat[c]) { byCat[c] = []; cats.push(c); }
      byCat[c].push(items[i]);
    }
    // Pack sections into columns. A section stays whole if it fits in a column;
    // only sections taller than a column get split, with a "(cont.)" header.
    var cols = [], cur = [];
    function flush() { if (cur.length) { cols.push(cur); cur = []; } }
    for (var k = 0; k < cats.length; k++) {
      var list = byCat[cats[k]], need = list.length + 1;
      if (need <= MENU_ROWS_PER_COL && cur.length + need > MENU_ROWS_PER_COL) flush();
      var pos = 0, first = true;
      while (pos < list.length) {
        if (cur.length >= MENU_ROWS_PER_COL - 1) flush();
        // repeat the header only when the section continues onto a new page
        // (i.e. the left column); continuing into the right column just flows
        if (first) cur.push({ cat: cats[k] });
        else if (cols.length % 2 === 0) cur.push({ cat: cats[k] + " (cont.)" });
        first = false;
        while (pos < list.length && cur.length < MENU_ROWS_PER_COL) cur.push({ item: list[pos++] });
      }
    }
    flush();
    var pages = [];
    for (var p = 0; p < cols.length; p += 2) pages.push({ type: "drinks", cols: cols.slice(p, p + 2), page: p / 2 + 1, pages: Math.ceil(cols.length / 2) });
    return pages;
  }

  // Tag a slide with what's on it, so the rotation can weight it.
  function tagSlide(sc) {
    sc.live = false; sc.hasPre = false;
    for (var i = 0; i < sc.games.length; i++) {
      if (sc.games[i].state === "in") sc.live = true;
      if (sc.games[i].state === "pre") sc.hasPre = true;
    }
    return sc;
  }

  function sportsScreens() {
    var out = [], leagues = scores.leagues || [];
    for (var i = 0; i < leagues.length; i++) {
      var games = leagues[i].games || [];
      if (!games.length) continue;
      var pages = Math.ceil(games.length / GAMES_PER_PAGE);
      for (var p = 0; p < pages; p++) {
        out.push(tagSlide({ type: "sports", league: leagues[i].name,
                            games: games.slice(p * GAMES_PER_PAGE, (p + 1) * GAMES_PER_PAGE),
                            page: p + 1, pages: pages }));
      }
    }
    return out;
  }

  function upNextScreen() {
    var leagues = scores.leagues || [], list = [];
    for (var i = 0; i < leagues.length; i++) {
      var games = leagues[i].games || [];
      for (var j = 0; j < games.length; j++) {
        if (games[j].state === "pre") list.push({ time: games[j].detail, league: leagues[i].name, away: games[j].away.name, home: games[j].home.name, tv: games[j].tv });
      }
    }
    if (!list.length) return [];
    list.sort(function (a, b) { return toMinutes(a.time) - toMinutes(b.time); });
    var out = [], pages = Math.ceil(list.length / UPNEXT_PER_PAGE);
    if (pages > 2) pages = 2;        // two slides of what's coming is plenty
    for (var p = 0; p < pages; p++) {
      out.push({ type: "upnext", games: list.slice(p * UPNEXT_PER_PAGE, (p + 1) * UPNEXT_PER_PAGE),
                 page: p + 1, pages: pages,
                 more: p === pages - 1 ? Math.max(0, list.length - pages * UPNEXT_PER_PAGE) : 0 });
    }
    return out;
  }
  function toMinutes(t) {
    var m = /^(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(t || "");
    if (!m) return 9999;
    var h = parseInt(m[1], 10) % 12; if (/pm/i.test(m[3])) h += 12;
    return h * 60 + parseInt(m[2], 10);
  }

  function yesterdayScreens() {
    var y = scores.yesterday, out = [];
    if (!y || !y.leagues || !y.leagues.length) return out;
    for (var i = 0; i < y.leagues.length; i++) {
      var games = y.leagues[i].games || [];
      if (!games.length) continue;
      var pages = Math.ceil(games.length / GAMES_PER_PAGE);
      for (var p = 0; p < pages; p++) {
        out.push(tagSlide({ type: "sports", league: y.leagues[i].name, lastNight: true,
                            games: games.slice(p * GAMES_PER_PAGE, (p + 1) * GAMES_PER_PAGE),
                            page: p + 1, pages: pages }));
      }
    }
    return out;
  }

  // The paper arrives as {briefs:[], features:[]}. Older files were a plain
  // array of headlines, so accept that shape too rather than showing nothing.
  function paperParts() {
    var n = (scores && scores.news) ? scores.news : null;
    if (!n) return { briefs: [], features: [] };
    if (Object.prototype.toString.call(n) === "[object Array]") return { briefs: n, features: [] };
    return { briefs: n.briefs || [], features: n.features || [] };
  }

  function briefScreens() {
    var b = paperParts().briefs, out = [];
    for (var i = 0; i < b.length; i += STORIES_PER_SLIDE) {
      out.push({ type: "brief", stories: b.slice(i, i + STORIES_PER_SLIDE),
                 page: Math.floor(i / STORIES_PER_SLIDE) + 1,
                 pages: Math.ceil(b.length / STORIES_PER_SLIDE) });
    }
    return out;
  }

  // One story becomes one unit of 1-2 slides. Units stay together in the
  // rotation so page 2 never turns up without page 1.
  function featureScreens() {
    var f = paperParts().features, out = [];
    for (var i = 0; i < f.length; i++) {
      var st = f[i];
      var paras = st.body && st.body.length ? st.body : (st.desc ? [st.desc] : []);
      if (!paras.length) continue;
      var pages = [], p = 0;
      while (p < paras.length && pages.length < FEATURE_MAX_PAGES) {
        var first = pages.length === 0;
        var cap = first ? FEAT_BODY_P1 : FEAT_BODY_P2;
        var pg = layoutPage(paras, p, cap);
        pages.push({ type: "feature", story: st, left: pg.left, right: pg.right, first: first });
        if (pg.next === p) break;         // nothing fit: stop rather than loop
        p = pg.next;
      }
      for (var k = 0; k < pages.length; k++) {
        pages[k].page = k + 1;
        pages[k].pages = pages.length;
      }
      out.push({ type: "feature", slides: pages });
    }
    return out;
  }

  // Rendered height of a run of paragraphs stacked in one column.
  function colHeight(list) {
    var h = 0;
    for (var i = 0; i < list.length; i++) {
      var lines = Math.max(1, Math.ceil(list[i].length / FEAT_CHARS_PER_LINE));
      h += lines * FEAT_LINE + (i ? FEAT_PARA_GAP : 0);
    }
    return h;
  }

  // Where to break a run into two columns so they come out closest in length,
  // with neither taller than the box. Reading order stays left then right.
  function bestSplit(list, capPx) {
    var bestK = -1, bestGap = 1e9, k, L, R;
    for (k = 1; k < list.length; k++) {
      L = colHeight(list.slice(0, k));
      R = colHeight(list.slice(k));
      if (L > capPx || R > capPx) continue;
      if (Math.abs(L - R) < bestGap) { bestGap = Math.abs(L - R); bestK = k; }
    }
    if (bestK < 0) return { left: list.slice(), right: [] };
    return { left: list.slice(0, bestK), right: list.slice(bestK) };
  }

  function pageFits(list, capPx) {
    if (colHeight(list) <= capPx) return true;          // all in one column
    for (var k = 1; k < list.length; k++) {
      if (colHeight(list.slice(0, k)) <= capPx && colHeight(list.slice(k)) <= capPx) return true;
    }
    return false;
  }

  // Take as many paragraphs as this page can hold, then balance them.
  function layoutPage(paras, start, capPx) {
    var take = [], i = start;
    while (i < paras.length) {
      var trial = take.concat([paras[i]]);
      if (take.length && !pageFits(trial, capPx)) break;
      take = trial; i++;
    }
    var split = bestSplit(take, capPx);
    return { left: split.left, right: split.right, next: start + take.length };
  }

  function pollScreens() {
    var r = (scores && scores.rankings) ? scores.rankings : [], out = [];
    for (var i = 0; i < r.length; i++) {
      if (r[i].rows && r[i].rows.length) out.push({ type: "poll", poll: r[i] });
    }
    return out;
  }

  function standingScreens() {
    var s = (scores && scores.standings) ? scores.standings : [], out = [];
    for (var i = 0; i < s.length; i++) {
      var gs = s[i].groups || [];
      for (var p = 0; p < gs.length; p += GROUPS_PER_SLIDE) {
        out.push({ type: "stand", league: s[i].league, groups: gs.slice(p, p + GROUPS_PER_SLIDE),
                   page: Math.floor(p / GROUPS_PER_SLIDE) + 1,
                   pages: Math.ceil(gs.length / GROUPS_PER_SLIDE) });
      }
    }
    return out;
  }

  function isMorning() {
    var h = new Date().getHours();
    return h >= MORNING_START && h < MORNING_END;
  }

  function harvardScreens() {
    var h = scores.harvard, out = [];
    if (!h || !h.games || !h.games.length) return out;
    var per = HARVARD_PER_PAGE, pages = Math.ceil(h.games.length / per);
    for (var p = 0; p < pages; p++) out.push({ type: "harvard", games: h.games.slice(p * per, (p + 1) * per), page: p + 1, pages: pages });
    return out;
  }

  function buildScreens() {
    try { buildScreens_(); } catch (e) {
      // fall back to the plain rotation if anything in the new code fails
      try {
        var d2 = drinkPages(), s2 = sportsScreens();
        screens = d2.concat(s2);
        if (!screens.length) screens = [{ type: "idle" }];
      } catch (e2) { screens = [{ type: "idle" }]; }
      if (idx >= screens.length) idx = -1;
      drawTally();
      if (window.onerror) window.onerror("buildScreens: " + (e && e.message ? e.message : e), "", 0);
    }
  }

  // =====================================================================
  //  THE GAME: special edition (Harvard-Yale, Nov 21 2026, Fenway Park)
  //
  //  Runs only between GAME.from and GAME.until. Outside that window, or if
  //  GAME.on is false, or if Yale wins, gamePhase() returns "" and the board
  //  is the ordinary board: no theme, no extra slides, nothing to undo.
  // =====================================================================
  var GAME = {
    on: true,                                             // master switch
    from:    new Date(2026, 10, 19, 0, 0, 0).getTime(),   // Thu Nov 19
    kickoff: new Date(2026, 10, 21, 15, 30, 0).getTime(), // Sat 3:30 PM
    until:   new Date(2026, 10, 23, 4, 0, 0).getTime(),   // Mon 4 AM: back to normal
    // Used until the live feed fills them in. Checked Nov 20.
    h: { name: "Harvard", rec: "8-1", conf: "5-1", ppg: "28.9", papg: "13.9" },
    y: { name: "Yale",    rec: "5-4", conf: "3-3", ppg: "27.8", papg: "21.6" },
    house: { name: "Ben Alvarez", jersey: "45", pos: "TE/FB", cls: "Jr.", home: "Yorkville, IL",
             career: { rec: 2, yds: 13, td: 1 }, today: "" }
  };

  function gamePhase() {
    if (!GAME.on) return "";
    var now = new Date().getTime();
    if (now < GAME.from || now >= GAME.until) return "";
    var g = scores.thegame;
    if (g && g.state === "post") return g.winner === "h" ? "won" : "";   // a loss: we never speak of it
    if (g && g.state === "in") return "live";
    return "pre";
  }

  // One side's numbers: live feed first, baked-in facts as the fallback.
  function gSide(k) {
    var base = GAME[k], live = (scores.thegame && scores.thegame[k]) || {}, out = {}, p;
    for (p in base) if (base.hasOwnProperty(p)) out[p] = base[p];
    for (p in live) if (live.hasOwnProperty(p) && live[p] !== "" && live[p] !== null) out[p] = live[p];
    return out;
  }
  function gHouse() {
    var live = (scores.thegame && scores.thegame.house) || {}, out = {}, p;
    for (p in GAME.house) if (GAME.house.hasOwnProperty(p)) out[p] = GAME.house[p];
    for (p in live) if (live.hasOwnProperty(p) && live[p] !== null) out[p] = live[p];
    return out;
  }
  function gLeaders(k) {
    var g = scores.thegame;
    return (g && g.leaders && g.leaders[k]) ? g.leaders[k] : [];
  }
  function gFind(list, cat) {
    for (var i = 0; i < list.length; i++) if (list[i].cat === cat) return list[i];
    return null;
  }
  function houseLine(h, today) {
    if (today && h.today) return h.today;
    if (today) return "Blocks don't show in the box score";
    var c = h.career || {}, rec = c.rec || 0, td = c.td || 0;
    var s = rec + (rec === 1 ? " catch, " : " catches, ") + td + " TD";
    if (rec > 0 && td * 2 === rec) s += ". Half of them score.";
    return s;
  }

  // Header strip, countdown and footer copy for the edition.
  var TAG_NORMAL = null, lastSkin = "?";
  function applySkin() {
    var ph = gamePhase(), tag = $("tag");
    if (TAG_NORMAL === null) TAG_NORMAL = tag.innerHTML;
    var h = gSide("h"), y = gSide("y"), text;
    if (ph === "pre")       text = "The Game &middot; 142nd playing &middot; Fenway Park &middot; Sat 3:30 on ESPNU";
    else if (ph === "live") text = "The Game is on &middot; ESPNU &middot; Beat Yale";
    else if (ph === "won")  text = "Harvard " + esc(h.score) + ", Yale " + esc(y.score) + " &middot; The Game stays in Boston";
    else                    text = TAG_NORMAL;
    var key = ph + "|" + text;
    if (key === lastSkin) return;
    lastSkin = key;
    document.body.className = ph ? "game " + ph : "";
    tag.innerHTML = text;
  }
  function gameDateLine() {
    var ph = gamePhase();
    if (ph === "live") return "Beat Yale";
    if (ph === "won") return "Champions";
    if (ph !== "pre") return "";
    var ms = GAME.kickoff - new Date().getTime();
    if (ms <= 0) return "Kickoff";
    var m = Math.floor(ms / 60000), d = Math.floor(m / 1440), hh = Math.floor((m % 1440) / 60), mm = m % 60;
    return "Kickoff " + (d ? d + "d " : "") + hh + "h " + pad(mm) + "m";
  }
  function gameNotices(ph) {
    var h = gSide("h"), y = gSide("y");
    if (ph === "won") return ["Scoreboard", "Harvard " + h.score + ", Yale " + y.score,
                              "#45 lives here. Autographs at the bar.", "Outright Ivy champions",
                              "Next: FCS playoffs, Nov 28", "Condolence drinks are full price"];
    return ["Beat Yale", "Yalies pay up front", "#45 lives here. Autographs at the bar.",
            "Boola Boola is a real song", "Safety school since 1701",
            "Fenway 2018: Harvard 45, Yale 27", "Kickoff 3:30. Be loud."];
  }
  var GAME_SPONSORS = ["Yale jokes courtesy of 142 years of practice",
                       "The Game is presented by nobody. It doesn't need it.",
                       "Officials not affiliated with this establishment",
                       "Official beverage of beating Yale: whatever's in the fridge"];

  function yaleNotes(ph) {
    var h = gSide("h"), y = gSide("y");
    if (ph === "won") return [
      "Scoreboard.",
      "Four straight is now zero straight.",
      "“Boola Boola.” Still a real song. Still didn’t help.",
      "Fenway Park, all time: Harvard 2, Yale 0.",
      "Lux et Veritas. Light and truth. The truth is " + h.score + "–" + y.score + ".",
      "Yale’s bus is on Lansdowne Street. Wave.",
      "Condolence drinks for Yalies are available at full price.",
      "New Haven is 130 miles that way. Safe travels."
    ];
    return [
      "Founded in 1701 by Harvard men who wanted somewhere quieter. They got New Haven.",
      "Their fight song is called “Boola Boola.” That is not a joke. We checked.",
      "The most beloved Yalie in history is a bulldog named Handsome Dan. Fair enough.",
      "New Haven: world-class pizza, and then you go home.",
      "It is pronounced “safety school.”",
      "Yale’s motto is Lux et Veritas: light and truth. The truth is " + h.rec + " versus " + y.rec + ".",
      "Yalies are welcome at Beren’s Nine. Yalies pay up front.",
      "They lead the series 72–61–8 and won the last four. Fenway remembers 45–27."
    ];
  }

  function gameScreens(ph) {
    var g = scores.thegame || {}, out = [], notes = yaleNotes(ph), i;
    var plays = g.plays || [];
    if (ph === "pre") {
      out.push({ type: "g_title" }, { type: "g_tape" }, { type: "g_players", side: "h" },
               { type: "g_players", side: "y" }, { type: "g_stakes" }, { type: "g_history" });
    } else if (ph === "live") {
      out.push({ type: "g_score" });
      if (plays.length) out.push({ type: "g_plays" });
      if (gLeaders("h").length) out.push({ type: "g_players", side: "h", today: true });
      out.push({ type: "g_tape" });
    } else if (ph === "won") {
      out.push({ type: "g_score", fin: true });

  function gameWeight(sc, ph) {
    switch (sc.type) {

      case "g_plays":   return sc.fin ? 3 : 4;

  function renderGame(sc) {

  // ===================== end of The Game edition =====================

  // ---------- how often each kind of slide comes up ----------
  // A slide's share of the rotation depends on what it is, whether anything on
  // it is live, and what time it is. Nobody wants a wall of finished scores at
  // 9 AM, and nobody wants the morning paper during a game.
  function weightFor(sc, hr) {
    var morning = hr >= MORNING_START && hr < MORNING_END;   // 5am - noon
    var midday  = hr >= MORNING_END && hr < 17;
    var evening = hr >= 17 && hr < 24;
    var late    = hr < 3;
    switch (sc.type) {
      case "sports":
        if (sc.lastNight) return morning ? 3 : 0.4;
        if (sc.live)      return morning ? 4 : (evening || late ? 7 : 5);
        if (sc.hasPre)    return morning ? 0.8 : (midday ? 3 : 2.5);
        return morning ? 0.6 : 1.2;                           // finals only
      case "upnext":  return morning ? 1.5 : (midday ? 3.5 : 2);
      case "harvard": return morning ? 2 : 1.5;
      case "drinks":  return morning ? 1 : (evening || late ? 4 : 2.5);
      case "brief":   return morning ? 6 : 0;
      case "feature": return morning ? 2.5 : 0;   // each one is 1-2 slides already
      case "poll":    return morning ? 3.5 : 0.5;
      case "stand":   return morning ? 3 : 0.4;
    }
    return 1;
  }

  // Smooth weighted round-robin: each slide appears in proportion to its
  // weight, spread out rather than clumped together.
  function weave(items, weights) {
    var total = 0, cur = [], out = [], i;
    for (i = 0; i < weights.length; i++) { cur.push(0); total += weights[i]; }
    if (total <= 0) return items.slice();
    for (var n = 0; n < total; n++) {
      var best = 0;
      for (i = 0; i < weights.length; i++) {
        cur[i] += weights[i];
        if (cur[i] > cur[best]) best = i;
      }
      out.push(items[best]);
      cur[best] -= total;
    }
    return out;
  }

  function buildScreens_() {
    var hr = new Date().getHours(), morning = isMorning();
    var all = drinkPages()
      .concat(sportsScreens())
      .concat(harvardScreens())
      .concat(upNextScreen());
    if (morning) {
      all = all.concat(briefScreens()).concat(featureScreens())
               .concat(pollScreens()).concat(standingScreens())
               .concat(yesterdayScreens());
    } else {
      all = all.concat(pollScreens());
    }

    // weight -> small integers, keeping the whole cycle a sane length
    var items = [], w = [], i, raw = [], sum = 0;
    for (i = 0; i < all.length; i++) {
      var wt = weightFor(all[i], hr);
      if (wt <= 0) continue;
      items.push(all[i]); raw.push(wt); sum += wt;
    }

    // Special edition: its slides take a fixed share of the rotation on top of
    // the ordinary board. Outside the window gamePhase() is "" and this is skipped.
    applySkin();
    var ph = gamePhase(), cap = MAX_CYCLE;
    if (ph) {
      var gs = gameScreens(ph), gw = [], gsum = 0, share = gameShare(ph);
      for (i = 0; i < gs.length; i++) { gw.push(gameWeight(gs[i], ph)); gsum += gw[i]; }
      var boost = (sum > 0 && gsum > 0) ? (share / (1 - share)) * sum / gsum : 1;
      for (i = 0; i < gs.length; i++) { items.push(gs[i]); raw.push(gw[i] * boost); sum += gw[i] * boost; }
      cap = 80;
    }
    if (!items.length) { screens = [{ type: "idle" }]; idx = -1; drawTally(); return; }
    var scale = sum > cap ? cap / sum : 1;
    for (i = 0; i < raw.length; i++) w.push(Math.max(1, Math.round(raw[i] * scale)));

    var woven = weave(items, w);
    screens = [];
    for (i = 0; i < woven.length; i++) {
      if (woven[i].slides) {
        for (var j = 0; j < woven[i].slides.length; j++) screens.push(woven[i].slides[j]);
      } else {
        screens.push(woven[i]);
      }
    }
    if (idx >= screens.length) idx = -1;
    drawTally();
  }

           '<div class="lg"><span' + (recap ? ' class="rc"' : '') + '>' + esc(LEAGUE_TAG[st.league] || st.league) + '</span></div>' +
           '<div class="hl">' + esc(st.headline) + '</div>' +
           (st.desc ? '<div class="ds">' + esc(st.desc) + '</div>' : '') +
           (st.by ? '<div class="by">' + esc(st.by) + '</div>' : '') +
           '</div>';
    }
    return h + '</div>';
  }

  function renderFeature(sc) {
    var st = sc.story || {}, cols = [sc.left || [], sc.right || []];
    var tag = LEAGUE_TAG[st.league] || st.league || "Sports";
    var h = head('The <span class="lg">feature</span>',
                 stampAt("", sc.pages > 1 ? tag + " · " + sc.page + "/" + sc.pages : tag));
    h += '<div class="body"><div class="feat">';
    if (sc.first) {
      h += '<div class="kick">' + esc(st.who || "Off the field") + '</div>' +
           '<div class="fhl">' + esc(st.headline || "") + '</div>' +
           '<div class="rule"></div>' +
           '<div class="fby">' + (st.by ? 'By ' + esc(st.by) : '&nbsp;') + '</div>';
    } else {
      h += '<div class="kick">' + esc(st.who || "") + ' &middot; continued</div>' +
           '<div class="rule"></div><div class="fby">&nbsp;</div>';
    }
    h += '<div class="fbody' + (sc.first ? '' : ' full') + '">';
    for (var c = 0; c < 2; c++) {
      h += '<div class="fcol' + (c === 1 ? ' last' : '') + '">';
      for (var i = 0; i < cols[c].length; i++) {
        var cls = (i === cols[c].length - 1) ? ' class="last"' : '';
        h += '<p' + cls + '>' + esc(cols[c][i]) + '</p>';
      }
      h += '</div>';
    }
    h += '</div>';
    if (sc.pages > 1 && sc.page < sc.pages) h += '<div class="more">continues &rarr;</div>';
    return h + '</div></div>';
  }

  function renderPoll(sc) {
    var p = sc.poll, rows = p.rows || [];
    var h = head(esc(p.poll) + ' <span class="lg">' + esc(LEAGUE_TAG[p.league] || p.league) + '</span>',
                 stampAt("y", "Top 25"));
    h += '<div class="body">';
    for (var c = 0; c < 2; c++) {
      var part = rows.slice(c * POLL_PER_COL, (c + 1) * POLL_PER_COL);
      if (!part.length) continue;
      h += '<div class="pollcol' + (c === 1 ? ' last' : '') + '"><table class="poll">';
      for (var i = 0; i < part.length; i++) {
        var r = part[i], mv = '';
        if (r.move && r.move.charAt(0) === '+') mv = '<span class="up">&#9650;' + esc(r.move.substring(1)) + '</span>';
        else if (r.move) mv = '<span class="dn">&#9660;' + esc(r.move.replace('-', '')) + '</span>';
        h += '<tr><td class="pn">' + esc(r.n) + '</td><td class="pt">' + esc(r.team) + '</td>' +
             '<td class="pr2">' + esc(r.rec) + '</td><td class="pm">' + mv + '</td></tr>';
      }
      h += '</table></div>';
    }
    return h + '</div>';
  }

  function renderStandings(sc) {
    var h = head('Standings <span class="lg">' + esc(sc.league) + '</span>',
                 stampAt("g", sc.pages > 1 ? sc.page + " of " + sc.pages : "Where things stand"));
    h += '<div class="body">';
    for (var g = 0; g < sc.groups.length; g++) {
      var grp = sc.groups[g];
      h += '<div class="stblk' + (g % 2 === 1 ? ' r' : '') + '"><div class="sh">' + esc(grp.name) + '</div><table class="st">';
      for (var i = 0; i < grp.rows.length; i++) {
        var r = grp.rows[i];
        h += '<tr><td class="sn">' + (i + 1) + '</td><td>' + esc(r.team) + '</td>' +
             '<td class="sr">' + esc(r.rec) + '</td><td class="sx">' + esc(r.extra || "") + '</td></tr>';
      }
      h += '</table></div>';
    }
    return h + '</div>';
  }

  function renderIdle() {
    return head('Board', '') + '<div class="idle"><div class="big">' + esc(BAR_NAME) + '</div><div class="small">Nothing on the wire. Check the fridge.</div></div>';
  }

  function render(sc) {
    try { return render_(sc); } catch (e) {
      return head('Board', '') + '<div class="idle"><div class="small">' + esc(String(e && e.message ? e.message : e)) + '</div></div>';
    }
  }
  function render_(sc) {
    if (sc.type.substring(0, 2) === "g_") return renderGame(sc);
    if (sc.type === "drinks") return renderDrinks(sc);
    if (sc.type === "sports") return renderSports(sc);
    if (sc.type === "upnext") return renderUpNext(sc);
    if (sc.type === "harvard") return renderHarvard(sc);
    if (sc.type === "brief" || sc.type === "news") return renderBriefs(sc);
    if (sc.type === "feature") return renderFeature(sc);
    if (sc.type === "poll") return renderPoll(sc);
    if (sc.type === "stand") return renderStandings(sc);
    return renderIdle();
  }

  function drawTally() {
    var h = "";
    for (var i = 0; i < screens.length; i++) h += '<span' + (i === idx ? ' class="on"' : '') + '></span>';
    $("tally").innerHTML = h;
  }

  function notices() {
    var ph = gamePhase();
    if (ph) return gameNotices(ph);
    return (drinks.notices && drinks.notices.length) ? drinks.notices : DEFAULT_NOTICES;
  }

  function next(step) {
    if (timer) { clearTimeout(timer); timer = null; }
    if (!screens.length) buildScreens();
    idx = ((idx + (step || 1)) % screens.length + screens.length) % screens.length;
    var front = frontIsA ? $("slideB") : $("slideA"), back = frontIsA ? $("slideA") : $("slideB");
    front.innerHTML = render(screens[idx]);
    front.className = "slide show"; back.className = "slide";
    frontIsA = !frontIsA;
    drawTally();
    var n = notices();
    $("notice").innerHTML = '<span class="stamp ' + (noticeIdx % 2 ? 'y' : '') + ' sm">' + esc(n[noticeIdx % n.length]) + '</span>';
    noticeIdx++;
    var sp = gamePhase() ? GAME_SPONSORS : SPONSORS;
    $("sponsor").innerHTML = esc(sp[idx % sp.length]) + (scores.updated ? '<span class="u">Scores as of ' + esc(fmtUpdated(scores.updated)) + '</span>' : '');
    if (!paused) timer = setTimeout(function () { next(1); }, dwellFor(screens[idx]) * 1000);
  }
  function dwellFor(sc) {
    if (sc && sc.type === "g_score" && !sc.fin) return 14;    // the live score lingers
    if (sc && sc.type === "g_notes") return 13;                 // four lines to read
    return (sc && sc.type === "feature") ? FEATURE_SECONDS : SECONDS_PER;
  }
  window.boardNext  = function () { next(1); };
  window.boardPrev  = function () { next(-1); };
  window.boardPause = function () {
    paused = !paused;
    $("paused").style.display = paused ? "block" : "none";
    if (paused) { if (timer) { clearTimeout(timer); timer = null; } }
    else if (!timer) timer = setTimeout(function () { next(1); }, dwellFor(screens[idx]) * 1000);
  };
  document.onkeydown = function (e) {
    e = e || window.event;
    var k = e.keyCode;
    if (k === 39 || k === 34) { next(1); return false; }        // right, page down
    if (k === 37 || k === 33) { next(-1); return false; }       // left, page up
    if (k === 13 || k === 32) { window.boardPause(); return false; } // enter, space
  };
  function fmtUpdated(s) {
    var m = /(\d{2}):(\d{2})$/.exec(s || ""); if (!m) return s;
    var h = parseInt(m[1], 10), ap = h < 12 ? "AM" : "PM"; h = h % 12; if (h === 0) h = 12;
    return h + ":" + m[2] + " " + ap;
  }

  function tick() {
    var d = new Date(), hr = d.getHours(), m = hr % 12; if (m === 0) m = 12;
    $("clock").innerHTML = m + ":" + pad(d.getMinutes()) + '<span style="font-size:20px"> ' + (hr < 12 ? "AM" : "PM") + '</span>';
    var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var gline = gameDateLine();
    $("date").innerHTML = gline ? gline : days[d.getDay()] + " " + mons[d.getMonth()] + " " + d.getDate();
    if (ticks % 30 === 0) applySkin();      // lets the edition switch itself on and off without a reload
    // Reload once a day, measured by uptime only. Never by comparing clocks:
    // if the TV's clock is unset or jumps, clock math can loop the reload.
    ticks++;
    if (ticks > 86400 && hr === RELOAD_HOUR) window.location.reload(true);
    if (ticks > 172800) window.location.reload(true);   // 48h, whatever the clock says
  }

  function fit() {
    var w = window.innerWidth || document.documentElement.clientWidth || 1280;
    var h = window.innerHeight || document.documentElement.clientHeight || 720;
    var sc = Math.min(w / 1280, h / 720) * SAFE_AREA;
    var st = $("stage").style;
    var t = "scale(" + sc + ")";
    st.webkitTransform = t; st.transform = t;
    st.left = Math.round((w - 1280 * sc) / 2) + "px";
    st.top  = Math.round((h - 720 * sc) / 2) + "px";
  }
  fit(); window.onresize = fit; setTimeout(fit, 1500);

  $("barname").innerHTML = esc(BAR_NAME);
  tick(); setInterval(tick, 1000);
  refresh(); setInterval(refresh, REFRESH_MINUTES * 60000);
  timer = setTimeout(function () { next(1); }, 800);
})();
</script>
</body>
</html>
