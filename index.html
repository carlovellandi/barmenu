<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=1280">
<title>Board</title>
<style>
  /* Written for a 2014-era WebKit TV browser: no flexbox, no CSS variables,
     no modern JS. Layout is tables and floats on purpose. */
  html, body { margin: 0; padding: 0; background: #143229; color: #F2E8CF;
               font-family: Georgia, "Times New Roman", Times, serif;
               overflow: hidden; width: 1280px; height: 720px; }
  #stage { position: relative; width: 1280px; height: 720px; }

  /* header */
  #top { position: absolute; left: 0; top: 0; width: 1280px; height: 84px;
         border-bottom: 2px solid #2C5A4A; }
  #room { position: absolute; left: 48px; top: 20px; font-size: 40px;
          letter-spacing: 1px; color: #F2E8CF; }
  #clock { position: absolute; right: 48px; top: 18px; font-size: 44px;
           color: #E3A93C; text-align: right; }
  #date { position: absolute; right: 48px; top: 62px; font-size: 15px;
          color: #8FB3A6; text-align: right; }

  /* panel */
  .panel { position: absolute; left: 0; top: 84px; width: 1280px; height: 596px;
           opacity: 0; -webkit-transition: opacity .6s; transition: opacity .6s; }
  .panel.show { opacity: 1; }
  .ptitle { position: absolute; left: 48px; top: 26px; font-size: 34px;
            color: #E3A93C; }
  .psub { position: absolute; right: 48px; top: 40px; font-size: 16px;
          color: #8FB3A6; }
  .pbody { position: absolute; left: 48px; top: 84px; width: 1184px; height: 490px; }

  /* drinks */
  .col { float: left; width: 560px; margin-right: 64px; }
  .col.last { margin-right: 0; }
  table.menu { width: 560px; border-collapse: collapse; }
  table.menu td { padding: 0 0 0 0; vertical-align: baseline; }
  tr.cat td { padding-top: 22px; padding-bottom: 6px; font-size: 18px; color: #8FB3A6;
              border-bottom: 1px solid #2C5A4A; letter-spacing: 2px; }
  tr.cat.first td { padding-top: 0; }
  tr.item td { padding-top: 9px; padding-bottom: 3px; font-size: 26px; }
  tr.item td.nm { width: 430px; }
  tr.item td.pr { text-align: right; color: #E3A93C; font-size: 24px; white-space: nowrap; }
  tr.item .nt { display: block; font-size: 15px; color: #8FB3A6; font-style: italic; padding-top: 2px; }

  /* scores */
  table.scores { width: 1184px; border-collapse: collapse;
                 font-family: Helvetica, Arial, sans-serif; }
  table.scores td { padding: 0 8px; height: 64px; vertical-align: middle;
                    border-bottom: 1px solid #2C5A4A; font-size: 25px; }
  table.scores tr.last td { border-bottom: 0; }
  td.tm { width: 380px; white-space: nowrap; overflow: hidden; }
  td.tm .rk { color: #8FB3A6; font-size: 17px; margin-right: 6px; }
  td.tm .rc { color: #8FB3A6; font-size: 15px; margin-left: 8px; }
  td.sc { width: 64px; text-align: right; font-size: 32px; color: #F2E8CF; }
  td.at { width: 40px; text-align: center; color: #8FB3A6; font-size: 18px; }
  td.st { width: 220px; text-align: right; color: #8FB3A6; font-size: 20px; white-space: nowrap; }
  td.st .live { color: #E45E4A; }
  td.st .tv { display: block; font-size: 14px; color: #5F8A7C; }
  tr.done td.tm, tr.done td.sc { color: #B8AD91; }
  tr.done td.tm.win, tr.done td.sc.win { color: #F2E8CF; }
  tr.pre td.sc { color: #2C5A4A; }

  /* harvard */
  table.hv { width: 1184px; border-collapse: collapse; font-family: Helvetica, Arial, sans-serif; }
  table.hv td { padding: 0 8px; height: 58px; vertical-align: middle; border-bottom: 1px solid #2C5A4A; font-size: 24px; }
  table.hv tr.last td { border-bottom: 0; }
  td.hsp { width: 260px; color: #8FB3A6; font-size: 19px; }
  td.hop { width: 520px; }
  td.hop .va { color: #8FB3A6; font-size: 18px; margin-right: 8px; }
  td.hsc { width: 150px; text-align: right; font-size: 30px; white-space: nowrap; }
  td.hsc .w { color: #E3A93C; }
  td.hst { text-align: right; color: #8FB3A6; font-size: 20px; white-space: nowrap; }
  td.hst .live { color: #E45E4A; }

  /* idle */
  .idle { position: absolute; left: 0; top: 200px; width: 1280px; text-align: center; }
  .idle .big { font-size: 48px; color: #E3A93C; }
  .idle .small { font-size: 20px; color: #8FB3A6; margin-top: 16px; }

  /* footer */
  #foot { position: absolute; left: 48px; right: 48px; bottom: 12px; height: 20px;
          font-size: 13px; color: #5F8A7C; font-family: Helvetica, Arial, sans-serif; }
  #dots { position: absolute; left: 0; top: 4px; }
  #dots span { display: inline-block; width: 8px; height: 8px; margin-right: 6px;
               background: #2C5A4A; border-radius: 4px; }
  #dots span.on { background: #E3A93C; }
  #upd { position: absolute; right: 0; top: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="top">
    <div id="room">The Room</div>
    <div id="clock">--:--</div>
    <div id="date"></div>
  </div>
  <div id="panelA" class="panel"></div>
  <div id="panelB" class="panel"></div>
  <div id="foot">
    <div id="dots"></div>
    <div id="upd"></div>
  </div>
</div>

<script>
(function () {
  // ---------- settings ----------
  var ROOM_NAME       = "The Room";  // shown top-left
  var SECONDS_PER     = 10;          // seconds each screen stays up
  var SPORTS_PER_DRINK= 2;           // show a drinks page after this many sports screens
  var GAMES_PER_PAGE  = 7;
  var MENU_ROWS_PER_COL = 9;         // item + category rows per column (2 columns)
  var REFRESH_MINUTES = 3;           // how often to re-read data from the site
  var RELOAD_HOUR     = 4;           // full page reload once a day at this hour (0-23)
  // --------------------------------

  var scores = { leagues: [] };
  var drinks = { items: [] };
  var screens = [];
  var idx = -1;
  var frontIsA = false;
  var startedAt = new Date().getTime();
  var lastReloadDay = -1;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  // ---------- data ----------
  function getJSON(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open("GET", url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + new Date().getTime(), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status === 200 || x.status === 0) {
        try { ok(JSON.parse(x.responseText)); } catch (e) { fail(e); }
      } else { fail(x.status); }
    };
    try { x.send(null); } catch (e) { fail(e); }
  }

  function refresh() {
    getJSON("data/scores.json", function (d) { scores = d || scores; buildScreens(); },
            function () { /* keep old data */ });
    getJSON("data/drinks.json", function (d) { drinks = d || drinks; buildScreens(); },
            function () { /* keep old data */ });
  }

  // ---------- screen list ----------
  function drinkPages() {
    var items = drinks.items || [];
    if (!items.length) return [];
    // group by category, preserving sheet order
    var cats = [], byCat = {};
    for (var i = 0; i < items.length; i++) {
      var c = items[i].cat || "Drinks";
      if (!byCat[c]) { byCat[c] = []; cats.push(c); }
      byCat[c].push(items[i]);
    }
    // flatten into rows, then chunk into columns of MENU_ROWS_PER_COL
    var rows = [];
    for (var k = 0; k < cats.length; k++) {
      rows.push({ cat: cats[k] });
      var list = byCat[cats[k]];
      for (var j = 0; j < list.length; j++) rows.push({ item: list[j] });
    }
    var cols = [];
    for (var r = 0; r < rows.length; r += MENU_ROWS_PER_COL) {
      var chunk = rows.slice(r, r + MENU_ROWS_PER_COL);
      // don't strand a category header at the bottom of a column
      if (chunk.length > 1 && chunk[chunk.length - 1].cat && r + MENU_ROWS_PER_COL < rows.length) {
        rows.splice(r + MENU_ROWS_PER_COL - 1, 0, { spacer: true });
        chunk = rows.slice(r, r + MENU_ROWS_PER_COL);
      }
      cols.push(chunk);
    }
    var pages = [];
    for (var p = 0; p < cols.length; p += 2) {
      pages.push({ type: "drinks", cols: cols.slice(p, p + 2), page: p / 2 + 1,
                   pages: Math.ceil(cols.length / 2) });
    }
    return pages;
  }

  function sportsScreens() {
    var out = [];
    var leagues = scores.leagues || [];
    for (var i = 0; i < leagues.length; i++) {
      var games = leagues[i].games || [];
      if (!games.length) continue;
      var pages = Math.ceil(games.length / GAMES_PER_PAGE);
      for (var p = 0; p < pages; p++) {
        out.push({ type: "sports", league: leagues[i].name,
                   games: games.slice(p * GAMES_PER_PAGE, (p + 1) * GAMES_PER_PAGE),
                   page: p + 1, pages: pages });
      }
    }
    return out;
  }

  function harvardScreen() {
    var h = scores.harvard;
    if (!h || !h.games || !h.games.length) return [];
    return [{ type: "harvard", games: h.games }];
  }

  function buildScreens() {
    var d = drinkPages(), s = sportsScreens().concat(harvardScreen()), list = [];
    if (!d.length && !s.length) {
      list.push({ type: "idle" });
    } else if (!s.length) {
      list = d;
    } else if (!d.length) {
      list = s;
    } else {
      var di = 0;
      for (var i = 0; i < s.length; i++) {
        if (i % SPORTS_PER_DRINK === 0) { list.push(d[di % d.length]); di++; }
        list.push(s[i]);
      }
      // make sure every drinks page shows at least once per cycle
      while (di < d.length) { list.push(d[di]); di++; }
    }
    screens = list;
    if (idx >= screens.length) idx = -1;
    drawDots();
    $("upd").innerHTML = scores.updated ? "Scores updated " + esc(scores.updated.slice(11)) : "";
  }

  // ---------- rendering ----------
  function renderDrinks(sc) {
    var h = '<div class="ptitle">What we have</div>';
    if (sc.pages > 1) h += '<div class="psub">' + sc.page + ' of ' + sc.pages + '</div>';
    h += '<div class="pbody">';
    for (var c = 0; c < sc.cols.length; c++) {
      h += '<div class="col' + (c === sc.cols.length - 1 ? ' last' : '') + '"><table class="menu">';
      var rows = sc.cols[c], firstCat = true;
      for (var r = 0; r < rows.length; r++) {
        var row = rows[r];
        if (row.spacer) continue;
        if (row.cat) {
          h += '<tr class="cat' + (firstCat ? ' first' : '') + '"><td colspan="2">' + esc(row.cat) + '</td></tr>';
          firstCat = false;
        } else {
          var it = row.item;
          h += '<tr class="item"><td class="nm">' + esc(it.name) +
               (it.note ? '<span class="nt">' + esc(it.note) + '</span>' : '') +
               '</td><td class="pr">' + esc(it.price) + '</td></tr>';
        }
      }
      h += '</table></div>';
    }
    return h + '</div>';
  }

  function teamCell(t, done) {
    var win = done && t.winner ? ' win' : '';
    return '<td class="tm' + win + '">' +
      (t.rank ? '<span class="rk">' + t.rank + '</span>' : '') + esc(t.name) +
      (t.rec ? '<span class="rc">' + esc(t.rec) + '</span>' : '') + '</td>' +
      '<td class="sc' + win + '">' + esc(t.score) + '</td>';
  }

  function renderSports(sc) {
    var h = '<div class="ptitle">' + esc(sc.league) + '</div>';
    if (sc.pages > 1) h += '<div class="psub">' + sc.page + ' of ' + sc.pages + '</div>';
    h += '<div class="pbody"><table class="scores">';
    for (var i = 0; i < sc.games.length; i++) {
      var g = sc.games[i], done = g.state === "post";
      var cls = (done ? 'done' : g.state) + (i === sc.games.length - 1 ? ' last' : '');
      var status = g.state === "in" ? '<span class="live">' + esc(g.detail) + '</span>' : esc(g.detail);
      if (g.state !== "post" && g.tv) status += '<span class="tv">' + esc(g.tv) + '</span>';
      h += '<tr class="' + cls + '">' + teamCell(g.away, done) +
           '<td class="at">' + (done || g.state === "in" ? '' : 'at') + '</td>' +
           teamCell(g.home, done) + '<td class="st">' + status + '</td></tr>';
    }
    return h + '</table></div>';
  }

  function renderHarvard(sc) {
    var h = '<div class="ptitle">Harvard</div><div class="psub">Today and the next few days</div>';
    h += '<div class="pbody"><table class="hv">';
    for (var i = 0; i < sc.games.length; i++) {
      var g = sc.games[i], last = i === sc.games.length - 1 ? ' class="last"' : '';
      var score = '', status;
      if (g.state === "pre") {
        status = esc(g.detail);
      } else {
        score = '<span class="' + (g.state === "post" && g.won ? 'w' : '') + '">' + esc(g.us) + '</span>' +
                '<span style="color:#8FB3A6"> &ndash; </span>' + esc(g.them);
        status = g.state === "in" ? '<span class="live">' + esc(g.detail) + '</span>' : esc(g.detail);
      }
      h += '<tr' + last + '><td class="hsp">' + esc(g.sport) + '</td>' +
           '<td class="hop"><span class="va">' + (g.home ? 'vs' : 'at') + '</span>' + esc(g.opp) + '</td>' +
           '<td class="hsc">' + score + '</td><td class="hst">' + status + '</td></tr>';
    }
    return h + '</table></div>';
  }

  function renderIdle() {
    return '<div class="idle"><div class="big">' + esc(ROOM_NAME) + '</div>' +
           '<div class="small">No games today. Add drinks to the sheet to show the menu here.</div></div>';
  }

  function render(sc) {
    if (sc.type === "drinks") return renderDrinks(sc);
    if (sc.type === "sports") return renderSports(sc);
    if (sc.type === "harvard") return renderHarvard(sc);
    return renderIdle();
  }

  function drawDots() {
    var h = "";
    for (var i = 0; i < screens.length; i++) h += '<span' + (i === idx ? ' class="on"' : '') + '></span>';
    $("dots").innerHTML = h;
  }

  function next() {
    if (!screens.length) buildScreens();
    idx = (idx + 1) % screens.length;
    var front = frontIsA ? $("panelB") : $("panelA");
    var back  = frontIsA ? $("panelA") : $("panelB");
    front.innerHTML = render(screens[idx]);
    front.className = "panel show";
    back.className = "panel";
    frontIsA = !frontIsA;
    drawDots();
    setTimeout(next, SECONDS_PER * 1000);
  }

  // ---------- clock + daily reload ----------
  function tick() {
    var d = new Date(), hr = d.getHours(), m = hr % 12; if (m === 0) m = 12;
    $("clock").innerHTML = m + ":" + pad(d.getMinutes()) + '<span style="font-size:22px"> ' + (hr < 12 ? "AM" : "PM") + '</span>';
    var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    $("date").innerHTML = days[d.getDay()] + ", " + mons[d.getMonth()] + " " + d.getDate();
    // reload once a day, or if the page has somehow been up for 30h
    var age = d.getTime() - startedAt;
    if ((hr === RELOAD_HOUR && d.getDate() !== lastReloadDay && age > 3600000) || age > 30 * 3600000) {
      lastReloadDay = d.getDate();
      window.location.reload(true);
    }
  }

  // ---------- go ----------
  $("room").innerHTML = esc(ROOM_NAME);
  tick(); setInterval(tick, 1000);
  refresh(); setInterval(refresh, REFRESH_MINUTES * 60000);
  setTimeout(next, 800);
})();
</script>
</body>
</html>
